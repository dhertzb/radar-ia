name: Radar diário
on:
  schedule:
    # 19:00 America/Sao_Paulo (UTC-3; o Brasil não adota horário de verão atualmente)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Executar com fixture de demonstração"
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: radar-ia-daily
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: apps/worker
      - name: Coletar, analisar e publicar
        working-directory: apps/worker
        env:
          TZ: America/Sao_Paulo
          API_URL: ${{ secrets.API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Radar IA https://github.com/dhertzb/radar-ia' }}
          NEWS_RSS_URLS: ${{ vars.NEWS_RSS_URLS }}
        run: uv run radar-ia-worker run ${{ inputs.demo && '--demo' || '' }}
