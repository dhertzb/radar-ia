[project]
name = "radar-ia-worker"
version = "0.1.0"
description = "Coleta e análise diária do Radar IA"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.13.3", "httpx>=0.28.1", "openai>=1.63.2", "pydantic>=2.10.6", "pydantic-settings>=2.7.1", "typer>=0.15.1", "feedparser>=6.0.11"]
[project.optional-dependencies]
dev = ["pytest>=8.3.4", "respx>=0.22.0", "ruff>=0.9.7"]
[project.scripts]
radar-ia-worker = "radar_worker.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/radar_worker"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
