services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: radar, POSTGRES_PASSWORD: radar, POSTGRES_DB: radar_ia }
    ports: ["5432:5432"]
    volumes: [radar_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_ia"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://radar:radar@postgres:5432/radar_ia?schema=public
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      INGEST_TOKEN: local-ingest-token
    ports: ["3001:3001"]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: http://localhost:3001/v1 }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:3001/v1 }
    ports: ["3000:3000"]
    depends_on: [api]
  worker:
    profiles: [worker]
    build: { context: apps/worker }
    environment: { API_URL: http://api:3001/v1, INGEST_TOKEN: local-ingest-token, WORKER_MODE: demo }
    depends_on: [api]
volumes: { radar_pg: {} }
